name: Backup diário do Firestore

on:
  schedule:
    # 03:00 UTC todos os dias (≈ 04:00/05:00 em Angola, consoante horário de verão) —
    # fora do horário de expediente para não coincidir com uso intenso do sistema.
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências do backup
        working-directory: backup
        run: npm install

      - name: Correr backup do Firestore
        working-directory: backup
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node backup-firestore.js

      - name: Guardar backup no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "Backup automático $(date -u +'%Y-%m-%d')"
          git push
